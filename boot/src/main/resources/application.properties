server.port=8095
spring.application.name=saga-orchestrator-service
matching.batch.client-capability-enabled=${MATCHING_BATCH_CLIENT_CAPABILITY_ENABLED:false}
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
matching.initial.max-retry-attempts=${MATCHING_INITIAL_MAX_RETRY_ATTEMPTS:10}
matching.initial.delay-seconds=${MATCHING_INITIAL_DELAY_SECONDS:30}
matching.initial.max-delay-seconds=${MATCHING_INITIAL_MAX_DELAY_SECONDS:300}
matching.initial.backoff-multiplier=${MATCHING_INITIAL_BACKOFF_MULTIPLIER:1.5}
app.saga.timeout.finding-shipper-minutes=${SAGA_FINDING_SHIPPER_TIMEOUT_MINUTES:5}

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/saga_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=${SAGA_DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${SAGA_DB_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.outbox.relay-enabled=${SAGA_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${SAGA_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${SAGA_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${SAGA_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${SAGA_OUTBOX_MAX_ATTEMPTS:10}
app.outbox.lease-seconds=${SAGA_OUTBOX_LEASE_SECONDS:30}
spring.task.scheduling.pool.size=${SAGA_SCHEDULER_POOL_SIZE:4}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=saga-orchestrator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=${SAGA_KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=${SAGA_KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${SAGA_KAFKA_DELIVERY_TIMEOUT_MS:10000}

# Canonical input topics with isolated-recovery overrides.
app.kafka.input-topics.order-created=${SAGA_INPUT_ORDER_CREATED_TOPIC:order.created}
app.kafka.input-topics.order-cancelled=${SAGA_INPUT_ORDER_CANCELLED_TOPIC:order.cancelled}
app.kafka.input-topics.restaurant-confirmed=${SAGA_INPUT_RESTAURANT_CONFIRMED_TOPIC:restaurant.order-confirmed}
app.kafka.input-topics.delivery-created=${SAGA_INPUT_DELIVERY_CREATED_TOPIC:delivery.created.result}
app.kafka.input-topics.shipper-accepted=${SAGA_INPUT_SHIPPER_ACCEPTED_TOPIC:delivery.shipper-accepted}
app.kafka.input-topics.delivery-status=${SAGA_INPUT_DELIVERY_STATUS_TOPIC:delivery.status-updated}
app.kafka.input-topics.shipper-rejected=${SAGA_INPUT_SHIPPER_REJECTED_TOPIC:delivery.shipper-rejected}
app.kafka.input-topics.shipper-found=${SAGA_INPUT_SHIPPER_FOUND_TOPIC:shipper.found}
app.kafka.input-topics.shipper-not-found=${SAGA_INPUT_SHIPPER_NOT_FOUND_TOPIC:shipper.not-found}
app.kafka.input-topics.delivery-created-failed=${SAGA_INPUT_DELIVERY_CREATED_FAILED_TOPIC:delivery.created.failed}
app.kafka.input-topics.delivery-cancel-failed=${SAGA_INPUT_DELIVERY_CANCEL_FAILED_TOPIC:delivery.cancel.failed}
app.kafka.input-topics.offer-persisted=${SAGA_INPUT_OFFER_PERSISTED_TOPIC:delivery.offer-persisted}
app.kafka.input-topics.offer-retired=${SAGA_INPUT_OFFER_RETIRED_TOPIC:delivery.offer-retired}
app.kafka.input-topics.offer-retired=${SAGA_INPUT_OFFER_RETIRED_TOPIC:delivery.offer-retired}
app.kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.initial-delay-ms=${KAFKA_RETRY_INITIAL_DELAY_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${KAFKA_RETRY_MAX_DELAY_MS:10000}
app.kafka.retry.auto-create-topics=${KAFKA_RETRY_AUTO_CREATE_TOPICS:false}

# Canonical production topics with isolated-recovery overrides.
app.kafka.topics.create-delivery=${SAGA_CREATE_DELIVERY_COMMAND_TOPIC:saga.command.create-delivery}
app.kafka.topics.cancel-delivery=${SAGA_CANCEL_DELIVERY_COMMAND_TOPIC:saga.command.cancel-delivery}
app.kafka.topics.find-shipper=${SAGA_FIND_SHIPPER_COMMAND_TOPIC:saga.command.find-shipper}
app.kafka.topics.cache-shipper-found=${SAGA_CACHE_SHIPPER_FOUND_COMMAND_TOPIC:saga.command.cache-shipper-found}
app.kafka.topics.expire-shipper-offer=${SAGA_EXPIRE_OFFER_COMMAND_TOPIC:saga.command.expire-shipper-offer}
app.kafka.topics.mark-shipper-not-found=${SAGA_MARK_SHIPPER_NOT_FOUND_COMMAND_TOPIC:saga.command.mark-shipper-not-found}
app.kafka.topics.stop-matching=${SAGA_STOP_MATCHING_COMMAND_TOPIC:saga.command.stop-matching}
app.kafka.topics.update-order-status=${SAGA_UPDATE_ORDER_STATUS_COMMAND_TOPIC:saga.command.update-order-status}

# Logging
logging.level.com.delivery.saga_orchestrator_service=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=WARN

# Awaited command replies: three resends, each with a fresh reply window.
app.saga.timeout.offer-persisting-seconds=${SAGA_OFFER_PERSISTING_TIMEOUT_SECONDS:120}
app.saga.timeout.compensating-seconds=${SAGA_COMPENSATING_TIMEOUT_SECONDS:120}
app.saga.timeout.offer-retiring-seconds=${SAGA_OFFER_RETIRING_TIMEOUT_SECONDS:120}
app.saga.timeout.max-resends=${SAGA_STUCK_STATE_MAX_RESENDS:3}
