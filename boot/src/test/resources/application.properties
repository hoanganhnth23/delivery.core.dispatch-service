# Test-only bootstrap; Redis/Kafka are mocked or explicitly isolated by tests.
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.kafka.listener.auto-startup=false
match.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.task.scheduling.enabled=false
settlement.service.url=http://settlement-service
app.internal.secret=test-internal-secret
spring.datasource.url=jdbc:h2:mem:match_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
app.outbox.relay-enabled=false
app.cancellation-projection.relay-enabled=true
