name: "PR Quality Check"

on:
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  quality-gate:
    name: "Quality Gate (Lint, Test, Security)"
    uses: hoanganhnth23/delivery.devops.centralized-ci/.github/workflows/quality-java.yml@main
    with:
      service_name: "dispatch"
    secrets: inherit
